[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Essl_F22_SDK"
dynamic = ["version"]
description = "Synchronous Python SDK for eSSL/ZKTeco F22 attendance and access terminals: read users/attendance/fingerprints, manage users and access schedules, and mirror device data read-only."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "amit das", email = "mramitdas99@gmail.com" },
]
requires-python = ">=3.12"
keywords = ["attendance", "biometric", "essl", "f22", "sdk", "zkteco"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

[project.optional-dependencies]
docs = ["mkdocs-material"]
mongo = ["pymongo>=4.10"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.2"]


[project.urls]
Homepage = "https://github.com/mramitdas/Essl_F22_SDK"
Repository = "https://github.com/mramitdas/Essl_F22_SDK"
Issues = "https://github.com/mramitdas/Essl_F22_SDK/issues"
Documentation = "https://github.com/mramitdas/Essl_F22_SDK/wiki"
Changelog = "https://github.com/mramitdas/Essl_F22_SDK/blob/prod/CHANGELOG.md"

[tool.hatch.version]
path = "src/essl_f22/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/essl_f22"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "psycopg",
    "psycopg.*",
    "pymysql",
    "pymysql.*",
    "pymongo",
    "pymongo.*",
    "redis",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=essl_f22", "--cov-report=term-missing"]
markers = ["hardware: requires a real eSSL/ZKTeco device"]
