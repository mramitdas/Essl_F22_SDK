[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "essl_f22"
version = "0.1.0"
description = "Synchronous Python SDK for eSSL/ZKTeco F22 terminals."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "amit das", email = "mramitdas99@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
docs = ["mkdocs-material"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.2"]


[project.urls]
Homepage = "https://github.com/mramitdas/essl-f22-sdk"
Repository = "https://github.com/mramitdas/essl-f22-sdk"
Issues = "https://github.com/mramitdas/essl-f22-sdk/issues"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "pymysql", "pymysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=essl_f22", "--cov-report=term-missing"]
markers = ["hardware: requires a real eSSL/ZKTeco device"]
